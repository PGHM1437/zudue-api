services:
  - type: web
    name: zudue-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --production=false && npx nest build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── Database ──────────────────────────────────────────────────────
      # Previous value could never connect, for two independent reasons:
      #   1. The password contained a raw `@`, which terminates the userinfo
      #      section of a URL — the driver parsed everything after it as the
      #      HOST and failed with "could not translate host name". Verified
      #      directly with psql. Any `@` in a password must be encoded %40.
      #   2. Host was aws-0-ap-south-1; this project answers on aws-1.
      # The value below is verified working (psql: "OK as postgres").
      #
      # NOTE: committing a database password to the repo is not good practice.
      # Prefer `sync: false` here and set the value in the Render dashboard so
      # it lives only there — and rotate this one, since it has been in git.
      - key: DATABASE_URL
        value: postgresql://postgres.jlmmpdupapuknhsnudeu:Zudue_live123@aws-1-ap-south-1.pooler.supabase.com:6543/postgres

      # ── Realtime (live call-state events over a WebSocket) ────────────
      # LISTEN needs a SESSION-level Postgres connection. DATABASE_URL above is the
      # :6543 TRANSACTION pooler, where LISTEN "succeeds" and then never delivers —
      # so this must be the session-mode URL (same pooler host, port 5432) or the
      # direct connection. Set it in the Render dashboard: it carries the DB
      # password. Unset or wrong, realtime simply stays off (the API logs exactly
      # why and refuses sockets with 503) and push + polling carry on unchanged.
      # See src/realtime/README.md.
      - key: DATABASE_URL_LISTEN
        sync: false
      # Kill switch: 'false' stops the listener and refuses every socket.
      - key: REALTIME_ENABLED
        value: 'true'

      # ── Auth ──────────────────────────────────────────────────────────
      # Verified: the JWKS endpoint serves an ES256 (EC P-256) key, so the
      # API's asymmetric verification path is correct for this project.
      - key: AUTH_JWKS_URL
        value: https://jlmmpdupapuknhsnudeu.supabase.co/auth/v1/.well-known/jwks.json
      - key: AUTH_ISSUER
        value: https://jlmmpdupapuknhsnudeu.supabase.co/auth/v1
      - key: AUTH_AUDIENCE
        value: authenticated
      # GoTrue admin key — the ONLY place this app holds elevated Supabase
      # access, used solely to delete the auth.users row once an account
      # deletion request's grace period elapses (rpc_purge_profile can only
      # reach app-owned tables, not auth.users itself). Optional: unset means
      # the purge sweep still anonymises profile data, just leaves the login
      # credential intact — logged loudly when that happens, never silent.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── CORS ──────────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: https://zudue.com,https://www.zudue.com,https://admin.zudue.com,https://zudue-app.vercel.app,https://zudue-2-0.vercel.app

      # ── Lifecycle scheduler ───────────────────────────────────────────
      # 'pgcron' (default): the money/call lifecycle (settle, stalled-call
      # sweep, no-show refunds, DM-window expiry) runs inside Postgres via
      # pg_cron — see migration 0090. This is deliberate: the old in-process
      # BullMQ worker only ran while this web service was awake, and Render
      # idles it on no traffic, so settlement silently paused for days
      # (verified 2026-08-30). pg_cron keeps running regardless.
      # Set to 'bullmq' ONLY alongside an always-on service + a live REDIS_URL.
      - key: JOBS_DRIVER
        value: pgcron

      # ── Redis ─────────────────────────────────────────────────────────
      # Only consumed when JOBS_DRIVER=bullmq. Left here so the fallback path
      # still works; harmless when unused. (Redis Cloud free instance.)
      - key: REDIS_URL
        value: redis://default:pTioppn3sgRmtjuzJY7XwomvN2V9ujri@taste-macrosolid-laurel-35421.db.redis.io:15498

      # ── Storage ───────────────────────────────────────────────────────
      # The previous S3_* keys were never read by this codebase — R2Provider
      # reads R2_* and calls getOrThrow on the two bucket names in its
      # CONSTRUCTOR, so they must be non-empty for the app to boot at all.
      - key: R2_BUCKET_KYC
        value: zudue-kyc
      - key: R2_BUCKET_MEDIA
        value: zudue-media
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_MEDIA_URL
        sync: false

      # ── Video (Agora) — REQUIRED for calls to connect ─────────────────
      # APP_ID is a public identifier (also in the mobile client); the
      # CERTIFICATE is secret. Both must be set in the dashboard or every
      # GET /calls/token/:meetingId 500s and no call can start.
      - key: AGORA_APP_ID
        value: e5eede7c5e11466b854d2c6d279d482f
      - key: AGORA_APP_CERTIFICATE
        sync: false

      # ── Push (FCM) — REQUIRED to ring the fan ─────────────────────────
      # FCM_SERVICE_ACCOUNT_B64 = base64 of the Firebase service-account JSON
      # (project zudue-59abf). Secret. Without it FcmProvider.enabled is false
      # and sendIncomingCall / notifyCallEnded silently send nothing.
      - key: FCM_PROJECT_ID
        value: zudue-59abf
      - key: FCM_SERVICE_ACCOUNT_B64
        sync: false

      # ── Optional integrations ─────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # OneSignal is the redundant push path — unset today; FCM alone rings.
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false

    # /v1 has no route mapped — only /v1/<module> paths exist — so this health
    # check gets a 404. Pointing it at a real public route means Render can
    # actually tell a booted API from a broken one.
    healthCheckPath: /v1/discover/categories
    autoDeploy: true
